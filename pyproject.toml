[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aox-agent-core"
version = "0.1.0.dev0"
description = "Routed Claude calls with structured outputs, tracing with cost, record/replay, human approvals, an append-only audit log and evals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.11,<2",
    "opentelemetry-api>=1.30,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=1.11,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
testing = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/AOX-LLC/agent-core"
Changelog = "https://github.com/AOX-LLC/agent-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "packaging>=24",
    "pytest>=9.1",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aox_agent_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import order
    "N",     # naming
    "PT",    # pytest style
    "RET",   # return statements
    "RUF",   # ruff-specific
    "S",     # bandit security checks
    "SIM",   # simplifications
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
