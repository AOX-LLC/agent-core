[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aox-agent-core"
version = "0.1.0a7"
description = "Routed Claude calls with structured outputs, tracing with cost, record/replay, human approvals, an append-only audit log and evals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=1.11,<2",
    "opentelemetry-api>=1.30,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=1.11,<2"]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
testing = ["pytest>=8"]

[project.scripts]
aox-agent-core = "aox_agent_core.cli:main"

[project.urls]
Repository = "https://github.com/AOX-LLC/agent-core"
Changelog = "https://github.com/AOX-LLC/agent-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=2.4",
    "opentelemetry-sdk>=1.30,<2",
    "packaging>=24",
    "pytest>=9.1",
    "psycopg[binary,pool]>=3.2,<4",
    "pytest-asyncio>=1.0",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aox_agent_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import order
    "N",     # naming
    "PT",    # pytest style
    "RET",   # return statements
    "RUF",   # ruff-specific
    "S",     # bandit security checks
    "SIM",   # simplifications
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240", "S101", "S603", "S608"]
# Table and column names in these modules are module constants; every value is
# passed as a bound parameter.
"src/aox_agent_core/audit/sql.py" = ["S608"]
"src/aox_agent_core/approvals/sql.py" = ["S608"]
# Schema and role names here pass identifier() (a plain lowercase name, quoted)
# before they reach SQL; every value is a bound parameter.
"src/aox_agent_core/_postgres_schema.py" = ["S608"]
"src/aox_agent_core/storage.py" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
