name: CI

# The job names lint, types, tests, package and gitleaks are required status
# checks on main (lint also checks that CHANGELOG.md has a section for the
# package version). Renaming one means updating the ruleset in the same change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.10"
  UV_LOCKED: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      # The release workflow refuses a tag whose version has no CHANGELOG section
      # (0.1.0a5 was tagged that way), so fail here, on the pull request, instead.
      - name: CHANGELOG has a section for the package version
        run: |
          version="$(uv version --short)"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section && NF { found = 1 }
            END { exit !found }
          ' CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::No non-empty '## [$version]' section for the package version $version."
            exit 1
          }

  types:
    name: types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    # The Postgres audit and approval tests run against this container; with
    # AGENT_CORE_REQUIRE_POSTGRES set they fail instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_CORE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      AGENT_CORE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  # The same tests against the newest Postgres major the project is run on. Postgres 16
  # is the minimum and is covered by the matrix above; this job is not a required check.
  test-postgres-17:
    name: test (postgres 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_CORE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      AGENT_CORE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  # One stable check name for branch protection, whatever the matrix holds.
  tests:
    name: tests
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = "success"

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Install the wheel alone in a clean environment
        run: |
          uv venv --no-project "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
      - name: Import it and check the bare install
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import re
          import sys

          import aox_agent_core
          from aox_agent_core import approvals, audit, evals, models, replay, testing, tracing

          core = sorted(
              re.match(r"[A-Za-z0-9._-]+", requirement).group()
              for requirement in metadata.requires("aox-agent-core") or []
              if "extra ==" not in requirement
          )
          assert core == ["anthropic", "opentelemetry-api", "pydantic"], core
          assert "pytest" not in sys.modules, "importing the library pulled in pytest"
          aox_agent_core.load_config()
          print("aox-agent-core", aox_agent_core.__version__, "imports cleanly")
          PY

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI, checksum-verified: the official gitleaks Action needs a paid
      # license on organization repositories.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
