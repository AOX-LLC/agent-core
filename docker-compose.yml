# Test-only Postgres for the audit-log tests. Not for production use.
# Trust auth means no password exists anywhere; this is safe only because
# the port is published on loopback (127.0.0.1) and never on other interfaces.
name: agent-core

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:4202:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
